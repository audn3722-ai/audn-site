# Настройки админки Pages CMS (app.pagescms.org)
media:
  input: public/uploads
  output: /uploads
content:
  - name: news
    label: Новости и объявления
    type: collection
    path: src/content/news
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    view:
      fields: [title, date, kind, lang]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: date
        label: Дата
        type: date
        required: true
      - name: kind
        label: Тип
        type: select
        default: news
        options:
          values:
            - { value: news, label: Новость }
            - { value: announcement, label: Объявление }
      - name: lang
        label: Язык
        type: select
        default: ru
        options:
          values:
            - { value: ru, label: Русский }
            - { value: kg, label: Кыргызский }
      - name: summary
        label: Краткое описание (1–2 предложения)
        type: text
      - name: image
        label: Главное фото
        type: image
      - name: draft
        label: Черновик (не показывать на сайте)
        type: boolean
        default: false
      - name: body
        label: Текст
        type: rich-text

  - name: documents
    label: Документы (PDF)
    type: collection
    path: src/content/documents
    filename: "doc-{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [title_ru, category]
      primary: title_ru
    fields:
      - name: title_ru
        label: Название (рус.)
        type: string
        required: true
      - name: title_kg
        label: Название (кырг.)
        type: string
      - name: category
        label: Раздел сайта
        type: select
        required: true
        options:
          values:
            - { value: charter, label: "Документы → Устав и регистрация" }
            - { value: license, label: "Документы → Лицензия и аккредитация" }
            - { value: regulations, label: "Документы → Положения и правила" }
            - { value: plan-law, label: "Учебный план → Юриспруденция" }
            - { value: plan-pedagogy, label: "Учебный план → Педагогика" }
            - { value: calendar, label: "Академический календарь" }
            - { value: schedule, label: "Студентам → Расписание" }
            - { value: practice, label: "Студентам → Практика" }
            - { value: materials, label: "Студентам → Полезные материалы" }
            - { value: research, label: "Наука → Исследования и публикации" }
      - name: file
        label: Файл (PDF, Word, Excel)
        type: file
      - name: link
        label: Или ссылка (если файла нет)
        type: string
      - name: date
        label: Дата
        type: date
      - name: order
        label: Порядок (меньше — выше)
        type: number
        default: 100

  - name: teachers
    label: Преподаватели
    type: collection
    path: src/content/teachers
    filename: "t-{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [name, role_ru, program]
      primary: name
    fields:
      - name: name
        label: ФИО
        type: string
        required: true
      - name: role_ru
        label: Должность (рус.), напр. «Старший преподаватель»
        type: string
        required: true
      - name: role_kg
        label: Должность (кырг.)
        type: string
      - name: program
        label: Направление
        type: select
        default: common
        options:
          values:
            - { value: law, label: Юриспруденция }
            - { value: pedagogy, label: Педагогика }
            - { value: common, label: Общие дисциплины }
      - name: disciplines_ru
        label: Дисциплины (рус.)
        type: string
      - name: disciplines_kg
        label: Дисциплины (кырг.)
        type: string
      - name: photo
        label: Фото
        type: image
      - name: order
        label: Порядок (меньше — выше)
        type: number
        default: 100

  - name: leadership
    label: Руководство
    type: collection
    path: src/content/leadership
    filename: "l-{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [name, role_ru]
      primary: name
    fields:
      - name: name
        label: ФИО
        type: string
        required: true
      - name: role_ru
        label: Должность (рус.)
        type: string
        required: true
      - name: role_kg
        label: Должность (кырг.)
        type: string
      - name: photo
        label: Фото
        type: image
      - name: order
        label: Порядок (меньше — выше)
        type: number
        default: 100

  - name: faq
    label: Вопросы и ответы
    type: collection
    path: src/content/faq
    filename: "faq-{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [question, lang]
      primary: question
    fields:
      - name: question
        label: Вопрос
        type: string
        required: true
      - name: lang
        label: Язык
        type: select
        default: ru
        options:
          values:
            - { value: ru, label: Русский }
            - { value: kg, label: Кыргызский }
      - name: order
        label: Порядок (меньше — выше)
        type: number
        default: 100
      - name: body
        label: Ответ
        type: rich-text

  - name: home
    label: Главная страница
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: hero_image
        label: Большое фото первого экрана (1920×1080)
        type: image
      - name: hero_video
        label: Фоновое видео первого экрана (MP4, необязательно)
        type: file
      - { name: subtitle_ru, label: Подзаголовок (рус.), type: text }
      - { name: subtitle_kg, label: Подзаголовок (кырг.), type: text }
      - { name: mission_title_ru, label: Заголовок миссии (рус.), type: string }
      - { name: mission_title_kg, label: Заголовок миссии (кырг.), type: string }
      - { name: mission_ru, label: Текст миссии (рус.), type: text }
      - { name: mission_kg, label: Текст миссии (кырг.), type: text }
      - name: stats
        label: Цифры (3 штуки)
        type: object
        list: { min: 3, max: 3 }
        fields:
          - { name: value, label: Цифра, type: string }
          - { name: label_ru, label: Подпись (рус.), type: string }
          - { name: label_kg, label: Подпись (кырг.), type: string }
      - { name: academics_text_ru, label: "Программы: вводный текст (рус.)", type: text }
      - { name: academics_text_kg, label: "Программы: вводный текст (кырг.)", type: text }
      - name: levels
        label: Вкладки программ
        type: object
        list: true
        fields:
          - { name: tab_ru, label: Название вкладки (рус.), type: string }
          - { name: tab_kg, label: Название вкладки (кырг.), type: string }
          - { name: image, label: Фото (1200×900), type: image }
          - { name: title_ru, label: Заголовок (рус.), type: string }
          - { name: title_kg, label: Заголовок (кырг.), type: string }
          - { name: text_ru, label: Описание (рус.), type: text }
          - { name: text_kg, label: Описание (кырг.), type: text }
          - { name: points_ru, label: "Ключевые дисциплины через ; (рус.)", type: string }
          - { name: points_kg, label: "Ключевые дисциплины через ; (кырг.)", type: string }
          - { name: link, label: "Ссылка (например /programs/law/)", type: string }
      - name: newsletter_action
        label: "Подписка: адрес формы (Google Forms …/formResponse). Пусто — кнопка «Открыть новости»"
        type: string
      - name: newsletter_field
        label: "Подписка: имя поля email (например entry.123456)"
        type: string
      - name: showcases
        label: Витрины «фото + текст»
        type: object
        list: true
        fields:
          - { name: image, label: Фото (1200×900), type: image }
          - { name: title_ru, label: Заголовок (рус.), type: string }
          - { name: title_kg, label: Заголовок (кырг.), type: string }
          - { name: text_ru, label: Текст (рус.), type: text }
          - { name: text_kg, label: Текст (кырг.), type: text }
          - { name: button_ru, label: Текст ссылки (рус.), type: string }
          - { name: button_kg, label: Текст ссылки (кырг.), type: string }
          - { name: link, label: "Ссылка (например /students/)", type: string }
      - name: alumni
        label: История выпускника
        type: object
        fields:
          - { name: quote_ru, label: Цитата (рус.), type: text }
          - { name: quote_kg, label: Цитата (кырг.), type: text }
          - { name: name, label: Имя и фамилия, type: string }
          - { name: program_ru, label: Программа (рус.), type: string }
          - { name: program_kg, label: Программа (кырг.), type: string }
          - { name: year, label: Год выпуска, type: string }
          - { name: photo, label: Фото (800×1000), type: image }
